# Cargo build configuration

[build]
# Use all available CPU cores for compilation
jobs = -1

# Faster linker for development (platform-specific)
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:NONE"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/ld"]

# Profile for faster dev builds
[profile.dev]
opt-level = 1

# Profile for faster release builds
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
