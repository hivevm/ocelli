[package]
name = "ocelli-server"
description = "The remote server: the web interface in a browser, next to the repositories (ADR-0037)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ocelli-server"
path = "src/main.rs"

# No part of Tauri or WebKit: the server runs on a machine without a display (ADR-0037).
[dependencies]
ocelli-commands = { workspace = true }
ocelli-core = { workspace = true }
ocelli-git = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22.1"
# Where a self-signed certificate is kept: the user's configuration directory (ADR-0038).
dirs = "7"
getrandom = "0.3.4"
# The host name a self-signed certificate is made for (ADR-0038).
gethostname = "1"
# TLS on a named address (ADR-0038): rustls with ring, its defaults TLS 1.2 and 1.3; rcgen makes
# the self-signed certificate; webpki decides whether the certificate names a request's Host.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# What axum serves through, used directly for the timeout on reading a request's headers.
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
git2 = { version = "0.20", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["io-util", "time"] }
tokio-tungstenite = "0.29.0"

[lints]
workspace = true
