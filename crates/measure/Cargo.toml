[package]
name = "ocelli-measure"
description = "Measures Ocelli's quality goals on real repositories (Q-1, Q-2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ocelli-measure"
path = "src/main.rs"

[dependencies]
ocelli-core = { workspace = true }
ocelli-git = { workspace = true }
anyhow = "1"

[dev-dependencies]
# The shared test support puts the developer's git configuration out of libgit2's reach.
git2 = { version = "0.20", default-features = false }

[lints]
workspace = true
