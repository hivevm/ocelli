# The git adapter writes the working directory through libgit2's checkout and hands libgit2 a path
# as written, never as a pattern (ADR-0033, docs/CONVENTIONS.md); it compares a path with a root
# only once both are resolved the same way (ADR-0039). A git2 method that unwraps a caller's
# string, or one a repository or a remote holds, is listed too: a panic aborts a release build,
# every tab of the remote server with it, and tests/git2_unwraps.txt audits each site. So is one
# that reads a path that is not UTF-8 as none, which a check would skip: a path is read and handed
# back in its bytes. So, too, is every libgit2 call that writes the working directory, called only
# through crate::workdir behind its guard, and the rebase whose steps write it, used only as
# workdir::Rebase. A method listed here is used only under `#[expect(clippy::disallowed_methods, reason = "…")]`, the reason
# saying why it is safe where it stands, and one that unwraps only inside its guarded wrapper.
disallowed-methods = [
    { path = "std::fs::write", reason = "follows a link and drops a file's mode: write the working directory through libgit2's checkout" },
    { path = "std::fs::remove_file", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::remove_dir_all", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::rename", reason = "the working directory changes through libgit2's checkout" },
