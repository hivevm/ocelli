# The git adapter writes the working directory through libgit2's checkout and hands libgit2 a path
# as written, never as a pattern (ADR-0033, docs/CONVENTIONS.md). A method listed here is used
# only under `#[expect(clippy::disallowed_methods, reason = "…")]`, the reason saying why it is
# safe where it stands.
disallowed-methods = [
    { path = "std::fs::write", reason = "follows a link and drops a file's mode: write the working directory through libgit2's checkout" },
    { path = "std::fs::remove_file", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::remove_dir_all", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::rename", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::copy", reason = "follows a link and drops a file's mode: write through libgit2's checkout" },
    { path = "std::fs::create_dir", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::create_dir_all", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::remove_dir", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::fs::set_permissions", reason = "a file's mode is written by libgit2's checkout" },
    { path = "std::fs::hard_link", reason = "the working directory changes through libgit2's checkout" },
    { path = "std::os::unix::fs::symlink", reason = "a link is written by libgit2's checkout", allow-invalid = true },
    { path = "std::fs::OpenOptions::open", reason = "follows a link and drops a file's mode: write through libgit2's checkout" },
    { path = "std::fs::File::create", reason = "follows a link and drops a file's mode: write through libgit2's checkout" },
    { path = "git2::build::CheckoutBuilder::path", reason = "a pattern to libgit2: turn the matching off with disable_pathspec_match" },
    { path = "git2::DiffOptions::pathspec", reason = "a pattern to libgit2: turn the matching off with disable_pathspec_match" },
    { path = "git2::StatusOptions::pathspec", reason = "a pattern to libgit2: turn the matching off with disable_pathspec_match" },
    { path = "git2::Repository::reset_default", reason = "reads each path as a pattern: put the entry in the index as written" },
    { path = "git2::Index::add_all", reason = "reads each path as a pattern" },
    { path = "git2::Index::update_all", reason = "reads each path as a pattern" },
    { path = "git2::Index::remove_all", reason = "reads each path as a pattern" },
]
