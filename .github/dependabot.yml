# Keeps the GitHub Actions under .github/workflows/ current: every action is pinned to a full
# commit SHA with its version as a comment (ADR-0010), and Dependabot raises a pull request that
# moves the pin and the comment together when an action publishes a new release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
