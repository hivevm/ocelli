name: Measure

# Measures the quality goals the checks cannot hold on every push, because they download, build,
# and measure for minutes (ADR-0008), weekly and on demand from the Actions tab:
# - Q-1, the edge crossings in Ocelli's layout against `git log --graph` on the corpus of feature
#   spec #11, by scripts/measure-crossings.sh. While Q-1 is missed the job only reports, as decided
#   in #14, and fails only when a repository cannot be fetched or measured.
# - Q-3, the memory of the desktop application on a repository of 100 000 commits, by
#   scripts/measure-memory.sh under a virtual display on Linux. While Q-3 is missed the job only
#   reports, as decided in #16, and fails only when the memory cannot be measured or the two runs
#   spread.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  crossings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version and the components; rustup materialises it.
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Measure edge crossings on the corpus
        run: bash scripts/measure-crossings.sh

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The desktop host links against WebKitGTK (ADR-0018); Xvfb is the virtual display.
      - name: Install the desktop host's Linux libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config xvfb
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the web interface's dependencies from the lockfile
        run: bun install --frozen-lockfile
      - name: Measure the desktop application's memory
        run: bash scripts/measure-memory.sh
