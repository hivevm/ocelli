name: Measure

# Measures the quality goals the checks cannot hold on every push, because they download, build,
# and measure for minutes (ADR-0007), weekly and on demand from the Actions tab:
# - Q-1, the edge crossings in Ocelli's layout on the corpus of feature spec #11 against the count
#   recorded for each repository's fixed commit, with git's count beside it, by
#   scripts/measure-crossings.sh.
# - Q-2, the wait for the first window of rows of a generated repository of a million commits, for
#   the slowest chunk taken in while the rest loads, and for the slowest window across its loaded
#   history, by scripts/measure-windows.sh.
# - Q-3, the memory the commit graph of a repository of 100 000 commits adds to the desktop
#   application over the empty application, by scripts/measure-memory.sh under a virtual display on
#   Linux.
# - The guards of the git adapter, each changed by a mutant the suite must catch, by
#   scripts/measure-mutants.sh (ADR-0007).
# Each job fails when its goal is missed or it cannot measure.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# Each measurement skips itself unless this is set, since scripts/check-all.sh runs them too.
env:
  OCELLI_MEASURE_ALL: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  crossings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version and the components; rustup materialises it.
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Measure edge crossings on the corpus
        run: bash scripts/measure-crossings.sh

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Measure the waits on a history of a million commits
        run: bash scripts/measure-windows.sh

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The desktop host links against WebKitGTK (ADR-0021); Xvfb is the virtual display.
      - name: Install the desktop host's Linux libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config xvfb
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the web interface's dependencies from the lockfile
        run: bun install --frozen-lockfile
      - name: Measure the desktop application's memory
        run: bash scripts/measure-memory.sh

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build the web interface the remote server's tests serve
        run: |
          bun install --frozen-lockfile
          bun run --cwd src-web build
      - name: Change each guard and expect the suite to fail
        run: bash scripts/measure-mutants.sh
