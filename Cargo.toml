[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/git",
    "crates/measure",
    "crates/tui",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

# No crate writes unsafe code; a block that must is allowed where it stands.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
ocelli-core = { path = "crates/core" }
ocelli-git = { path = "crates/git" }
